<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="attn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#nn-bg)" />
  <rect x="20" y="20" width="760" height="360" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <text x="50" y="60" fill="#f8fafc" font-family="'Comfortaa', sans-serif" font-size="20" font-weight="bold">Transformer Multi-Head Attention Architecture</text>
  <text x="50" y="85" fill="#94a3b8" font-family="monospace" font-size="12">Scaled Dot-Product Attention: Softmax(Q K^T / sqrt(d_k)) V</text>

  <!-- Input Embeddings (V, K, Q) -->
  <rect x="70" y="290" width="100" height="45" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="120" y="318" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Input (V)</text>

  <rect x="210" y="290" width="100" height="45" fill="rgba(129,140,248,0.15)" stroke="#818cf8" stroke-width="1.5" />
  <text x="260" y="318" fill="#818cf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Input (K)</text>

  <rect x="350" y="290" width="100" height="45" fill="rgba(244,63,94,0.15)" stroke="#f43f5e" stroke-width="1.5" />
  <text x="400" y="318" fill="#f43f5e" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Input (Q)</text>

  <!-- Linear Projections -->
  <path d="M 120 290 L 120 250" stroke="#38bdf8" stroke-width="2" />
  <path d="M 260 290 L 260 250" stroke="#818cf8" stroke-width="2" />
  <path d="M 400 290 L 400 250" stroke="#f43f5e" stroke-width="2" />

  <rect x="70" y="210" width="380" height="40" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="260" y="235" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">Linear Projections (W_V, W_K, W_Q)</text>

  <!-- MatMul Q and K^T -->
  <path d="M 330 210 L 330 165" stroke="#94a3b8" stroke-width="2" />
  <rect x="250" y="125" width="160" height="40" fill="rgba(244,63,94,0.2)" stroke="#f43f5e" stroke-width="1.5" />
  <text x="330" y="150" fill="#fecdd3" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MatMul (Q · K^T)</text>

  <!-- Scale & Mask & Softmax -->
  <path d="M 410 145 L 470 145" stroke="#94a3b8" stroke-width="2" />
  <rect x="470" y="125" width="130" height="40" fill="rgba(52,211,153,0.2)" stroke="#34d399" stroke-width="1.5" />
  <text x="535" y="150" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Scale &amp; Softmax</text>

  <!-- MatMul with V -->
  <path d="M 535 165 L 535 230 L 630 230" stroke="#94a3b8" stroke-width="2" fill="none" />
  <path d="M 120 210 L 120 180 L 630 180" stroke="#38bdf8" stroke-width="2" fill="none" />
  <rect x="630" y="170" width="120" height="70" fill="rgba(168,85,247,0.25)" stroke="#c084fc" stroke-width="1.5" />
  <text x="690" y="200" fill="#f3e8ff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MatMul (A · V)</text>
  <text x="690" y="225" fill="#c084fc" font-family="monospace" font-size="11" text-anchor="middle">Output Head</text>
</svg>