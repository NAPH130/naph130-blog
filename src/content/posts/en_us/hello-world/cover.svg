<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="g_hw_cover_en" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <pattern id="grid_hw_cover_en" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="card_grad_en" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#g_hw_cover_en)" />
  <rect width="1200" height="675" fill="url(#grid_hw_cover_en)" />

  <!-- Ambient light circles -->
  <circle cx="280" cy="180" r="220" fill="white" fill-opacity="0.14" />
  <circle cx="940" cy="500" r="260" fill="white" fill-opacity="0.10" />
  <circle cx="600" cy="337" r="160" fill="#38bdf8" fill-opacity="0.15" />

  <!-- Center frame box -->
  <rect x="250" y="167" width="700" height="340" fill="url(#card_grad_en)" stroke="white" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Accent top highlight line -->
  <line x1="250" y1="167" x2="950" y2="167" stroke="white" stroke-opacity="0.8" stroke-width="2" />

  <!-- Typography -->
  <text x="600" y="310" font-family="'Outfit', -apple-system, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">
    HELLO WORLD
  </text>
  <text x="600" y="365" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24" font-weight="600" fill="#e0f2fe" text-anchor="middle" letter-spacing="2">
    &lt;Hello World /&gt;
  </text>
  <text x="600" y="420" font-family="'Comfortaa', -apple-system, sans-serif" font-size="18" fill="white" fill-opacity="0.8" text-anchor="middle" letter-spacing="1">
    Markdown Showcase &amp; Style Diagnostics
  </text>
</svg>