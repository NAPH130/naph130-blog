<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="graph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#graph-bg)" />
  <rect x="20" y="20" width="760" height="360" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <text x="50" y="60" fill="#f8fafc" font-family="'Comfortaa', sans-serif" font-size="20" font-weight="bold">Directed Acyclic Graph &amp; Shortest Path Topology</text>
  <text x="50" y="85" fill="#94a3b8" font-family="monospace" font-size="12">Graph G = (V, E) | Dijkstra &amp; Bellman-Ford Dynamic Programming</text>

  <!-- Edges -->
  <line x1="120" y1="200" x2="260" y2="130" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />
  <line x1="120" y1="200" x2="260" y2="270" stroke="#38bdf8" stroke-width="2" />
  <line x1="260" y1="130" x2="440" y2="130" stroke="#818cf8" stroke-width="2" />
  <line x1="260" y1="130" x2="440" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3" />
  <line x1="260" y1="270" x2="440" y2="270" stroke="#818cf8" stroke-width="2" />
  <line x1="440" y1="130" x2="620" y2="200" stroke="#34d399" stroke-width="2" />
  <line x1="440" y1="270" x2="620" y2="200" stroke="#34d399" stroke-width="2" />

  <!-- Node S -->
  <circle cx="120" cy="200" r="32" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <text x="120" y="206" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">S (0)</text>

  <!-- Node A -->
  <circle cx="260" cy="130" r="28" fill="#4338ca" stroke="#818cf8" stroke-width="2" />
  <text x="260" y="136" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">A (4)</text>

  <!-- Node B -->
  <circle cx="260" cy="270" r="28" fill="#4338ca" stroke="#818cf8" stroke-width="2" />
  <text x="260" y="276" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">B (2)</text>

  <!-- Node C -->
  <circle cx="440" cy="130" r="28" fill="#6d28d9" stroke="#a78bfa" stroke-width="2" />
  <text x="440" y="136" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">C (7)</text>

  <!-- Node D -->
  <circle cx="440" cy="270" r="28" fill="#6d28d9" stroke="#a78bfa" stroke-width="2" />
  <text x="440" y="276" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">D (5)</text>

  <!-- Node T -->
  <circle cx="620" cy="200" r="32" fill="#059669" stroke="#34d399" stroke-width="2" />
  <text x="620" y="206" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">T (9)</text>

  <!-- Edge Weights -->
  <text x="180" y="150" fill="#38bdf8" font-family="monospace" font-size="12">w=4</text>
  <text x="180" y="250" fill="#38bdf8" font-family="monospace" font-size="12">w=2</text>
  <text x="350" y="120" fill="#818cf8" font-family="monospace" font-size="12">w=3</text>
  <text x="350" y="290" fill="#818cf8" font-family="monospace" font-size="12">w=3</text>
  <text x="530" y="150" fill="#34d399" font-family="monospace" font-size="12">w=2</text>
  <text x="530" y="250" fill="#34d399" font-family="monospace" font-size="12">w=4</text>
</svg>