<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b26" />
      <stop offset="100%" stop-color="#2d124d" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#pipe-bg)" />
  <rect x="20" y="20" width="760" height="360" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <text x="50" y="60" fill="#f8fafc" font-family="'Comfortaa', sans-serif" font-size="20" font-weight="bold">Modern 3D Programmable Graphics Pipeline</text>
  <text x="50" y="85" fill="#c084fc" font-family="monospace" font-size="12">Vertex Shader → Primitive Assembly → Rasterization → Fragment / PBR Shader</text>

  <!-- Stage 1: Vertex -->
  <rect x="50" y="150" width="140" height="150" fill="rgba(192,132,252,0.15)" stroke="#c084fc" stroke-width="1.5" />
  <text x="120" y="185" fill="#f3e8ff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Vertex Stage</text>
  <text x="120" y="220" fill="#c084fc" font-family="monospace" font-size="11" text-anchor="middle">VBO / EBO</text>
  <text x="120" y="250" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">MVP Matrix</text>
  <text x="120" y="280" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">P · V · M · v</text>

  <!-- Arrow -->
  <path d="M 195 225 L 225 225" stroke="#c084fc" stroke-width="2" />

  <!-- Stage 2: Primitive & Clip -->
  <rect x="230" y="150" width="140" height="150" fill="rgba(244,114,182,0.15)" stroke="#f472b6" stroke-width="1.5" />
  <text x="300" y="185" fill="#fdf2f8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Clipping</text>
  <text x="300" y="220" fill="#f472b6" font-family="monospace" font-size="11" text-anchor="middle">NDC Space</text>
  <text x="300" y="250" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">Perspective Div</text>
  <text x="300" y="280" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">[-1, 1]^3</text>

  <!-- Arrow -->
  <path d="M 375 225 L 405 225" stroke="#f472b6" stroke-width="2" />

  <!-- Stage 3: Rasterization -->
  <rect x="410" y="150" width="140" height="150" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="480" y="185" fill="#f0f9ff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Rasterize</text>
  <text x="480" y="220" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Interpolation</text>
  <text x="480" y="250" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">Fragments Gen</text>
  <text x="480" y="280" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Barycentric</text>

  <!-- Arrow -->
  <path d="M 555 225 L 585 225" stroke="#38bdf8" stroke-width="2" />

  <!-- Stage 4: Fragment / PBR -->
  <rect x="590" y="150" width="160" height="150" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.5" />
  <text x="670" y="185" fill="#ecfdf5" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Fragment Stage</text>
  <text x="670" y="220" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">PBR Shading</text>
  <text x="670" y="250" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">Cook-Torrance</text>
  <text x="670" y="280" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">FrameBuffer</text>
</svg>