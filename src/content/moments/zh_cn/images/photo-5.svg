  <circle cx="450" cy="560" r="210" fill="white" fill-opacity="0.08" />

  <!-- Center frame box (straight corners) -->
  <rect x="48" y="260" width="504" height="280" fill="black" fill-opacity="0.25" stroke="white" stroke-opacity="0.4" stroke-width="2" />

  <!-- Typography -->
  <text x="300" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="800" fill="white" text-anchor="middle" letter-spacing="2">
