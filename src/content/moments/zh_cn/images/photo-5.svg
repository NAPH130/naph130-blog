  </text>
  <text x="300" y="418" font-family="monospace, sans-serif" font-size="22.8" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    3:4 Portrait (Vertical Studio)
  </text>
  <text x="300" y="448" font-family="monospace, sans-serif" font-size="18" fill="white" fill-opacity="0.75" text-anchor="middle">
