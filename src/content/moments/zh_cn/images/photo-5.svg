      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <pattern id="grid_g_photo_5_svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background without rounded corners -->
  <rect width="600" height="800" fill="url(#g_photo_5_svg)" />
