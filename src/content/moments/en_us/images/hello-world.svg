      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <pattern id="grid_moment_hw_en" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#g_moment_hw_en)" />
  <rect width="1200" height="675" fill="url(#grid_moment_hw_en)" />

  <!-- Ambient visual circles -->
