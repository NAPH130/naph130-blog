  <rect x="280" y="187" width="640" height="300" fill="black" fill-opacity="0.25" stroke="white" stroke-opacity="0.45" stroke-width="2" />

  <!-- Typography -->
  <text x="600" y="325" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">
