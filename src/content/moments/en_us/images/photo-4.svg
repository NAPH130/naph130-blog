<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="g_photo_4_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <pattern id="grid_g_photo_4_svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background without rounded corners -->
  <rect width="800" height="600" fill="url(#g_photo_4_svg)" />
  <rect width="800" height="600" fill="url(#grid_g_photo_4_svg)" />

  <!-- Ambient visual circles -->
  <circle cx="200" cy="180" r="180" fill="white" fill-opacity="0.12" />
  <circle cx="600" cy="420" r="210" fill="white" fill-opacity="0.08" />

  <!-- Center frame box (straight corners) -->
  <rect x="120" y="160" width="560" height="280" fill="black" fill-opacity="0.25" stroke="white" stroke-opacity="0.4" stroke-width="2" />

  <!-- Typography -->
  <text x="400" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="800" fill="white" text-anchor="middle" letter-spacing="2">
    PHOTO-4.SVG
  </text>
  <text x="400" y="318" font-family="monospace, sans-serif" font-size="22.8" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    4:3 Standard (Classic Photo)
  </text>
  <text x="400" y="348" font-family="monospace, sans-serif" font-size="18" fill="white" fill-opacity="0.75" text-anchor="middle">
    800 × 600 px
  </text>
</svg>